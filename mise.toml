[tools]
bun = "1.3.12"
python = "3.12" 

 [tasks."api.docs.build"]
description = "Generate the final static HTML documentation"
dir="api"
run = ["poetry run sphinx-apidoc -f -o docs/api .", "poetry run sphinx-build -b html docs docs/_build/html"]

[tasks."api.docs.clean"]
description = "Remove the documentation build directory"
dir="api"
run = "rm -rf docs/_build"

[tasks."api.docs.serve"]
description = "Start the documentation server with hot-reload"
dir="api"
run = "poetry run sphinx-autobuild docs docs/_build/html --watch apps --port 5000 --ignore '**/_build/**'"

[tasks.docs]
description = "Alias for the documentation dev server"
alias = "docs:api:serve"


[tasks."api.linter"]
description = "Run Ruff linter on the api/ directory"
dir="api"
run = "poetry run ruff check ."

[tasks."api.formatter"]
description = "Run Ruff formatter on the api/ directory"
dir="api"
run = "poetry run ruff format ."

[tasks."api.test"]
description = "Run pytest on the api/ directory"
dir="api"
run = "poetry run pytest "

[tasks."api.test.cov"]
description = "Run pytest with coverage on the api/ directory"
dir="api"
run = "poetry run pytest --cov"
