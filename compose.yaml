services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: easy_rota
      POSTGRES_USER: easy_rota
      POSTGRES_PASSWORD: easy_rota
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    image: easy-rota
    ports:
      - "8000:8000"
    env_file:
      - api/.env.production
    depends_on:
      - db
volumes:
  postgres_data: