[project]
name = "easy-rota"
version = "0.1.0"
description = ""
authors = [
    {name = "EasyRota"}
]
license = "MPL-2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django (>=6.0.4,<7.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "djangorestframework-simplejwt (>=5.5.0,<6.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "django-webpush>=0.3.6",
    "pywebpush>=2.3.0",
    "django-apscheduler>=0.7.0",
    "gunicorn (>=26.0.0,<27.0.0)",
    "whitenoise (>=6.12.0,<7.0.0)",
    "dj-database-url (>=3.1.2,<4.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "resend (>=2.30.1,<3.0.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipython (>=9.12.0,<10.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "ruff (>=0.15.10,<0.16.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "pytest-bdd (>=8.1.0,<9.0.0)",
    "pytest-playwright (>=0.7.2,<0.8.0)",
    "playwright (>=1.58.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-django (>=4.12.0,<5.0.0)",
    "drf-spectacular (>=0.29.0,<0.30.0)",
    "black (>=26.3.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "pre-commit (>=4.6.0,<5.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "flake8-pyproject (>=1.2.4,<2.0.0)",
    "autopep8 (>=2.3.2,<3.0.0)",
]
docs = [
    "sphinx (>=9.1.0,<10.0.0)",
    "sphinx-autobuild (>=2025.8.25,<2026.0.0)",
    "furo (>=2025.12.19,<2026.0.0)"
]

[tool.flake8]
max-line-length = 88
