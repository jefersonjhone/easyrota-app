[project]
name = "easy-rota"
version = "0.1.0"
description = ""
authors = [
    {name = "EasyRota"}
]
license = "MPL-2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard] (>=0.135.3,<0.136.0)",
    "iceaxe (>=0.11.0,<0.12.0)",
    "structlog (>=25.5.0,<26.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipython (>=9.12.0,<10.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "ruff (>=0.15.10,<0.16.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "pytest-bdd (>=8.1.0,<9.0.0)",
    "pytest-playwright (>=0.7.2,<0.8.0)",
    "playwright (>=1.58.0,<2.0.0)"
]
